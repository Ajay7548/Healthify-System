# Render Blueprint for the Express API (Docker web service).
# In the Render dashboard: New > Blueprint, point it at this repo. Then set the
# three sync:false secrets (MONGODB_URI from Atlas, CORS_ORIGIN = your Vercel URL,
# SEED_ADMIN_PASSWORD). The JWT secrets are generated automatically.
services:
  - type: web
    name: healthcare-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    # Idempotent: ensures the demo accounts + sample data exist on each release,
    # and runs before the new version starts serving traffic.
    preDeployCommand: node src/db/seed.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI # MongoDB Atlas SRV connection string
        sync: false
      - key: CORS_ORIGIN # the deployed web origin, e.g. https://your-app.vercel.app
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: SEED_ADMIN_EMAIL
        value: admin@healthcare.test
      - key: SEED_ADMIN_PASSWORD
        sync: false
