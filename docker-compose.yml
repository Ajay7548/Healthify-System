# One-command local backend: MongoDB + the API (seeded), plus a DB browser.
# The web app runs separately with `pnpm --filter @hc/web dev` (HMR), proxying
# /api to the API on :4000.
#
#   docker compose up --build
#
# Mongo's port is intentionally NOT published, so this won't clash with a local
# mongod you might already run on 27017.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Seed (idempotent) then start the server.
    command: sh -c "node src/db/seed.js && node src/server.js"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/healthcare
      CORS_ORIGIN: http://localhost:5173
      # Override these for anything beyond a local demo (openssl rand -base64 48).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-compose-access-secret-0000000000}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-compose-refresh-secret-1111111111}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      SEED_ADMIN_EMAIL: admin@healthcare.test
      SEED_ADMIN_PASSWORD: Admin123!
    ports:
      - '4000:4000'

  # Optional: browse the database at http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: 'false'
    ports:
      - '8081:8081'

volumes:
  mongo-data:
